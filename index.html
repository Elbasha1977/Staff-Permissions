<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الاستئذان - مدرسة أحمد بن راشد المريخي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { 
      --primary: #8a1538; 
      --primary-light: #a61b45;
      --gold: #d4af37; 
      --bg: #0f172a; 
      --card-bg: rgba(255, 255, 255, 0.98);
    }
    
    * { box-sizing: border-box; font-family: 'Cairo', Tahoma, sans-serif; }
    
    body { 
      margin: 0; padding: 20px; 
      background: linear-gradient(135deg, #1e1e2f 0%, #0f172a 100%);
      direction: rtl; color: #333; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* الإطار المتحرك الفخم */
    .animated-wrapper {
      background: linear-gradient(270deg, var(--primary), var(--gold), #17a2b8, var(--primary-light));
      background-size: 800% 800%;
      animation: gradientBorder 6s ease infinite;
      padding: 6px;
      border-radius: 20px;
      width: 100%;
      max-width: 650px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    @keyframes gradientBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 25px 20px;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    /* ترويسة النظام والشعار */
    .header-title {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }
    .header-title h1 {
      color: var(--primary);
      margin: 10px 0 5px 0;
      font-size: 1.4rem;
      font-weight: 800;
    }
    .header-title p {
      color: #666;
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
    }
    
    /* تنسيق الشعار الجديد (بعرض الصفحة بالكامل) */
    .school-logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }
    .school-logo {
      width: 100%;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }

    /* حقول الإدخال */
    .form-group { margin-bottom: 15px; }
    label { 
      display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 0.9rem; 
    }
    input, select { 
      width: 100%; padding: 14px; 
      border: 1px solid #ddd; border-radius: 10px; 
      font-size: 1rem; font-family: 'Cairo', sans-serif;
      background: #f9f9f9;
      transition: all 0.3s ease;
    }
    input:focus, select:focus { 
      border-color: var(--primary); 
      background: white;
      box-shadow: 0 0 0 4px rgba(138, 21, 56, 0.1); 
      outline: none;
    }

    /* الأزرار */
    .btn { 
      padding: 14px 20px; border: none; border-radius: 10px; 
      cursor: pointer; font-weight: 800; font-size: 1rem;
      width: 100%; transition: all 0.3s ease;
      font-family: 'Cairo', sans-serif;
    }
    .btn-primary { 
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); 
      color: white; 
      box-shadow: 0 4px 15px rgba(138, 21, 56, 0.3);
    }
    .btn-primary:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(138, 21, 56, 0.4);
    }

    /* معلومات الموظف */
    .emp-info-box {
      background: #fff8f9;
      border: 1px solid #f5d6dc;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .emp-info-box p { margin: 5px 0; font-size: 0.95rem; color: #555; }
    .emp-info-box strong { color: var(--primary); }

    .balance-badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .hidden { display: none !important; }
    .row { display: flex; gap: 10px; }

    /* لوحة الإدارة */
    .admin-grid { 
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
      gap: 15px; margin-bottom: 20px; 
    }
    .stat-box { 
      background: white; border-right: 5px solid var(--primary); 
      padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }
    .stat-box h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: #666; }
    .stat-box .value { font-size: 2rem; font-weight: bold; color: var(--primary); }
  </style>
</head>
<body>

  <!-- بوابة الموظف -->
  <div id="employeePortal" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    <div class="animated-wrapper" id="loginCard">
      <div class="card">
        <div class="header-title">
          <!-- حاوية الشعار بعرض الصفحة -->
          <div class="school-logo-container">
            <img src="https://i.postimg.cc/tRm07wZF/MOTTO.png" alt="شعار المدرسة" class="school-logo">
          </div>
          <h1>نظام الاستئذان</h1>
          <p>مدرسة أحمد بن راشد المريخي الابتدائية بنين</p>
        </div>
        
        <div class="form-group">
          <label>أدخل رقمك الوظيفي أو الشخصي</label>
          <input type="text" id="empIdInput" placeholder="مثال: 114945" style="text-align: center; font-size: 1.2rem; letter-spacing: 2px;">
        </div>
        
        <button class="btn btn-primary" onclick="verifyEmp()">تسجيل الدخول</button>
        <p id="loginError" style="color:#dc3545; text-align:center; margin-top:15px; font-weight:bold; font-size:0.9rem;"></p>
      </div>
    </div>

    <div id="formScreen" class="animated-wrapper hidden">
      <div class="card">
        <div class="header-title">
          <h1>طلب استئذان جديد</h1>
        </div>
        
        <div class="emp-info-box">
          <p>مرحباً، <strong><span id="empName"></span></strong></p>
          <p>المسمى: <span id="empJob"></span></p>
          <p>الرصيد المتبقي: <span id="empBalance" class="balance-badge"></span></p>
        </div>

        <div class="form-group">
          <label>نوع الإذن</label>
          <select id="permType">
            <option value="تأخر صباحي">تأخر صباحي</option>
            <option value="إذن خروج وعودة">إذن خروج وعودة</option>
            <option value="خروج مبكر">خروج مبكر</option>
            <option value="ورشة تعليمية">ورشة تعليمية (لا يخصم)</option>
            <option value="مهمة رسمية">مهمة رسمية (لا يخصم)</option>
          </select>
        </div>

        <div class="form-group">
          <label>التاريخ</label>
          <input type="date" id="permDate">
        </div>

        <div class="row">
          <div class="form-group" style="flex:1;">
            <label>وقت الخروج</label>
            <input type="time" id="exitTime" onchange="calcDuration()">
          </div>
          <div class="form-group" style="flex:1;">
            <label>وقت العودة</label>
            <input type="time" id="returnTime" onchange="calcDuration()">
          </div>
        </div>

        <div class="form-group">
          <label>سبب الاستئذان</label>
          <input type="text" id="reason" placeholder="اذكر السبب...">
        </div>

        <button class="btn btn-primary" onclick="submitRequest()">إرسال الطلب</button>
        <p style="text-align:center; color:green; font-weight:bold; margin-top:15px;" id="successMsg"></p>
      </div>
    </div>
  </div>

  <!-- واجهة الإدارة السرية -->
  <div id="adminLogin" class="animated-wrapper hidden">
    <div class="card">
      <div class="header-title">
        <div style="font-size: 3rem; margin-bottom: 10px;">🔒</div>
        <h1>منطقة الإدارة</h1>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="adminPass" placeholder="••••••••" style="text-align:center;">
      </div>
      <button class="btn btn-primary" onclick="checkAdminPass()">دخول</button>
    </div>
  </div>

  <div id="adminDashboard" class="animated-wrapper hidden" style="max-width: 800px;">
    <div class="card">
      <div class="header-title">
        <h1>لوحة الإحصائيات</h1>
      </div>
      <div class="admin-grid" id="statsGrid"></div>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
      
      <h2 style="color: var(--primary); font-size: 1.1rem; margin-top: 0;">البحث عن سجل موظف</h2>
      <div style="display:flex; gap:10px; margin-bottom: 15px;">
        <input type="text" id="searchEmpId" placeholder="أدخل الرقم الوظيفي">
        <button class="btn btn-primary" style="width:100px; margin-top:0;" onclick="searchHistory()">بحث</button>
      </div>
      <div id="historyResult"></div>
    </div>
  </div>

  <!-- زر الإدارة السري (مخفي في الزاوية) -->
  <div style="position:fixed; bottom:15px; left:15px; opacity:0.3; cursor:pointer; font-size: 1.5rem;" onclick="showAdminLogin()">
    ⚙️
  </div>

<script>
  // 🔴 ضع رابط Google Apps Script هنا 🔴
  const API_URL = 'https://script.google.com/macros/s/AKfycbwsQntdXq-h9vi3hkZfdoYtLIeV-hBVaw-BHTXnUXyzyC24eWyiyN2oHVYSEs4fYDQq/exec';
  
  // 🔴 اسم ملف الأسماء الذي سيرفعه GitHub (بدون تغيير) 🔴
  const JSON_URL = 'encoded_data.txt';

  const ADMIN_PASS = "admin123";
  let currentEmp = null;

  // جلب الأسماء وفك التشفير مع معالجة الأخطاء
  async function fetchEmployees() {
    try {
      const res = await fetch(JSON_URL);
      if (!res.ok) throw new Error("لم يتم العثور على ملف البيانات");
      
      const b64 = await res.text();
      // تنظيف النص من أي مسافات أو أسطر جديدة
      const cleanB64 = b64.replace(/\s/g, '');
      
      // فك تشفير Base64 بطريقة آمنة للغة العربية
      const decoded = decodeURIComponent(escape(window.atob(cleanB64)));
      return JSON.parse(decoded);
    } catch(e) { 
      console.error("خطأ في جلب البيانات:", e);
      document.getElementById('loginError').innerText = "خطأ في تحميل قاعدة البيانات. يرجى مراجعة الإدارة.";
      return []; 
    }
  }

  // دالة مساعدة للاتصال بـ Google Apps Script
  async function apiCall(action, payload) {
    try {
      if (action === 'getBalance') {
        const res = await fetch(`${API_URL}?action=getBalance&empId=${payload.empId}`);
        return await res.json();
      } else {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: action, ...payload })
        });
        return await res.json();
      }
    } catch (e) {
      return { success: false, message: "خطأ في الاتصال بالخادم." };
    }
  }

  // التحقق من الموظف
  async function verifyEmp() {
    const id = document.getElementById('empIdInput').value.trim();
    if(!id) return;
    
    document.getElementById('loginError').innerText = "جاري التحقق...";
    document.getElementById('loginError').style.color = "#666";
    
    const emps = await fetchEmployees();
    if(emps.length === 0) return; // إذا فشل تحميل البيانات يتوقف هنا

    let emp = emps.find(e => e.employeeId === id || e.personalId === id);

    if(!emp) {
      document.getElementById('loginError').innerText = "أنت غير مسجل بهذه المدرسة.";
      document.getElementById('loginError').style.color = "#dc3545";
      return;
    }

    // استبدال كريم بالدوسري
    if(emp.name.includes('كريم احمد')) {
      emp.name = "محمد عبد الله برمان الدوسري";
      emp.jobTitle = "منسق تربية رياضية";
    }

    currentEmp = emp;
    
    // جلب الرصيد
    const balRes = await apiCall('getBalance', { empId: emp.employeeId });
    
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('formScreen').classList.remove('hidden');
    document.getElementById('empName').innerText = emp.name;
    document.getElementById('empJob').innerText = emp.jobTitle;
    document.getElementById('empBalance').innerText = (balRes.balance || 600) + " دقيقة";
    document.getElementById('loginError').innerText = "";
    
    // تعيين تاريخ اليوم
    document.getElementById('permDate').valueAsDate = new Date();
  }

  // حساب المدة
  function calcDuration() {
    const exit = document.getElementById('exitTime').value;
    const ret = document.getElementById('returnTime').value;
    const type = document.getElementById('permType').value;
    if (type === 'ورشة تعليمية' || type === 'مهمة رسمية') return 0;
    if (exit && ret) {
      const [eh, em] = exit.split(':');
      const [rh, rm] = ret.split(':');
      return (rh*60 + +rm) - (eh*60 + +em);
    }
    return 0;
  }

  // إرسال الطلب
  async function submitRequest() {
    const date = document.getElementById('permDate').value;
    if(!date) { alert("يرجى تحديد التاريخ"); return; }

    const duration = calcDuration();
    const data = {
      empId: currentEmp.employeeId,
      name: currentEmp.name,
      jobTitle: currentEmp.jobTitle,
      permissionType: document.getElementById('permType').value,
      date: date,
      exitTime: document.getElementById('exitTime').value,
      returnTime: document.getElementById('returnTime').value,
      reason: document.getElementById('reason').value,
      duration: duration
    };

    document.getElementById('successMsg').innerText = "جاري الحفظ...";
    document.getElementById('successMsg').style.color = "#666";
    
    const res = await apiCall('submit', { data: data });
    
    if(res.success) {
      document.getElementById('successMsg').innerText = `✅ تم الحفظ بنجاح! رقم الطلب: ${res.requestId}`;
      document.getElementById('successMsg').style.color = "#28a745";
      document.getElementById('reason').value = "";
      verifyEmp(); // تحديث الرصيد
    } else {
      document.getElementById('successMsg').innerText = "حدث خطأ أثناء الحفظ.";
      document.getElementById('successMsg').style.color = "#dc3545";
    }
  }

  // ================== لوحة الإدارة ==================
  function showAdminLogin() {
    document.getElementById('employeePortal').classList.add('hidden');
    document.getElementById('adminDashboard').classList.add('hidden');
    document.getElementById('adminLogin').classList.remove('hidden');
  }

  function checkAdminPass() {
    if (document.getElementById('adminPass').value === ADMIN_PASS) {
      document.getElementById('adminLogin').classList.add('hidden');
      document.getElementById('adminDashboard').classList.remove('hidden');
      loadStats();
    } else { alert("كلمة المرور خاطئة"); }
  }

  async function loadStats() {
    const res = await apiCall('getStats', {});
    if(res.success) {
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-box"><h3>إجمالي الطلبات</h3><div class="value">${res.total}</div></div>
        <div class="stat-box" style="border-right-color:#28a745;"><h3>أكاديمي</h3><div class="value">${res.academic}</div></div>
        <div class="stat-box" style="border-right-color:#17a2b8;"><h3>إداري</h3><div class="value">${res.admin}</div></div>
      `;
    }
  }
</script>
</body>
</html>
