name: Build and Deploy Secure System

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Decode and Prepare Files
        run: |
          # 1. فك تشفير جزئي الواجهة ودمجهما
          echo -n "${{ secrets.INDEX_PART_1 }}" | base64 --decode > index_part1.html
          echo -n "${{ secrets.INDEX_PART_2 }}" | base64 --decode > index_part2.html
          cat index_part1.html index_part2.html > index.html
          rm index_part1.html index_part2.html
          
          # 2. فك تشفير ملف الأسماء
          echo -n "${{ secrets.STUDENTS_PART_1 }}" | base64 --decode > data.json
          
          # 3. إعادة تشفير الأسماء بدون فواصل أسطر
          base64 -w 0 data.json > encoded_data.txt
          
          # 4. حذف الملف الأصلي
          rm data.json
          
          # 5. التحقق من نجاح الدمج (اختياري لكن مفيد)
          echo "=== حجم index.html ==="
          wc -c index.html
          echo "=== آخر 3 أسطر من index.html (للتأكد من اكتمال الملف) ==="
          tail -n 3 index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
