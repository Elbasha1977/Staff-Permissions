name: Build and Deploy Secure System

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Decode and Merge Files
        run: |
          # 1. فك تشفير ملف الواجهة (لأنه سر واحد فقط)
          echo -n "${{ secrets.INDEX_PART_1 }}" | base64 --decode > index.html
          
          # 2. فك تشفير ملف الأسماء (لأنه سر واحد فقط)
          echo -n "${{ secrets.STUDENTS_PART_1 }}" | base64 --decode > data.json
          
          # 3. إعادة تشفير ملف الأسماء ليتم رفعه على الموقع
          base64 data.json > encoded_data.txt
          
          # 4. استبدال رابط الـ JSON داخل الـ HTML ليشير للملف المشفر
          sed -i "s|JSON_URL_PLACEHOLDER|./encoded_data.txt|g" index.html
          
          # 5. حذف الملف الأصلي غير المشفر
          rm data.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
